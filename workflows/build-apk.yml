name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: APK derle (debug + release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK dosyalarını yeniden adlandır
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk     out/FB-Deutsch-Akademie-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/FB-Deutsch-Akademie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FB-Deutsch-Akademie-APK
          path: out/*.apk

  # Web sürümünü GitHub Pages'te yayınlar (HTTPS → mikrofon ve PWA kurulumu çalışır).
  # Kullanmak için: Repo Settings → Pages → Source: "GitHub Actions".
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true   # Pages açık değilse APK derlemesini etkilemesin
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
